# Validate the collection's skills tooling.
#
# Jobs (also the expected status-check names for branch protection):
#   test            - focused regression tests for the scripts
#   sync            - module/template/profile/combined-copy synchronization
#   validate        - SKILL.md frontmatter validation
#   category-index  - docs/CATEGORY_INDEX.md freshness check
#
# Requires only Python and PyYAML (scripts/requirements.txt). No Node toolchain.

name: skills-tooling

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --requirement scripts/requirements.txt
      - name: Run script regression tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

  sync:
    name: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check duplicated rule copies
        run: python scripts/check-sync.py

  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --requirement scripts/requirements.txt
      - name: Validate SKILL.md frontmatter
        run: python scripts/validate-frontmatter.py

  category-index:
    name: category-index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --requirement scripts/requirements.txt
      - name: Check docs/CATEGORY_INDEX.md is up to date
        run: python scripts/update-category-index.py --check
